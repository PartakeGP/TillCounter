<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Till Count</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.4;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 { margin-top: 0; }

    .section-title {
      margin-top: 24px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
      font-weight: bold;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .money-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .money-row {
      display: grid;
      grid-template-columns: 1fr 90px 110px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .line-total {
      background: #f1f1f1;
    }

    .total-box {
      margin-top: 24px;
      padding: 16px;
      background: #eef4ee;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover { opacity: 0.92; }

    .status {
      margin-top: 14px;
      font-weight: 600;
    }

    .note {
      color: #555;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .top-grid,
      .money-columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Till Count</h1>

    <form id="till-form">
      <input type="hidden" name="access_key" value="074cde09-5057-440d-84c2-7fc030aedb17" />
      <input type="hidden" name="subject" value="Till Count Submission" />
      <input type="hidden" name="from_name" value="Partake Till Counter" />
      <input type="hidden" name="to" value="cat@partakegp.com" />

      <input type="hidden" name="total" id="total-hidden" value="0.00" />
      <input type="hidden" name="submission_timestamp" id="timestamp-hidden" />
      <input type="hidden" name="submission_timestamp_iso" id="timestamp-iso-hidden" />

      <div class="section-title">Submission Info</div>
      <div class="top-grid">
        <div>
          <label for="associate">Associate Name</label>
          <input type="text" id="associate" name="associate_name" required />
        </div>

        <div>
          <label for="station">Station</label>
          <select id="station" name="station" required>
            <option value="">Select station</option>
            <option value="Lounge/Retail">Lounge/Retail</option>
            <option value="Event">Event</option>
            <option value="Dine">Dine</option>
          </select>
        </div>
      </div>

      <div class="money-columns">
        <div>
          <div class="section-title">Coins</div>

          <div class="money-row">
            <label for="pennies">Pennies</label>
            <input type="number" id="pennies" name="pennies_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="pennies-total" name="pennies_total" readonly />
          </div>

          <div class="money-row">
            <label for="nickels">Nickels</label>
            <input type="number" id="nickels" name="nickels_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="nickels-total" name="nickels_total" readonly />
          </div>

          <div class="money-row">
            <label for="dimes">Dimes</label>
            <input type="number" id="dimes" name="dimes_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="dimes-total" name="dimes_total" readonly />
          </div>

          <div class="money-row">
            <label for="quarters">Quarters</label>
            <input type="number" id="quarters" name="quarters_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="quarters-total" name="quarters_total" readonly />
          </div>
        </div>

        <div>
          <div class="section-title">Bills</div>

          <div class="money-row">
            <label for="ones">$1</label>
            <input type="number" id="ones" name="ones_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="ones-total" name="ones_total" readonly />
          </div>

          <div class="money-row">
            <label for="twos">$2</label>
            <input type="number" id="twos" name="twos_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="twos-total" name="twos_total" readonly />
          </div>

          <div class="money-row">
            <label for="fives">$5</label>
            <input type="number" id="fives" name="fives_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="fives-total" name="fives_total" readonly />
          </div>

          <div class="money-row">
            <label for="tens">$10</label>
            <input type="number" id="tens" name="tens_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="tens-total" name="tens_total" readonly />
          </div>

          <div class="money-row">
            <label for="twenties">$20</label>
            <input type="number" id="twenties" name="twenties_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="twenties-total" name="twenties_total" readonly />
          </div>

          <div class="money-row">
            <label for="fifties">$50</label>
            <input type="number" id="fifties" name="fifties_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="fifties-total" name="fifties_total" readonly />
          </div>

          <div class="money-row">
            <label for="hundreds">$100</label>
            <input type="number" id="hundreds" name="hundreds_quantity" min="0" step="1" />
            <input class="line-total" type="text" id="hundreds-total" name="hundreds_total" readonly />
          </div>
        </div>
      </div>

      <div class="total-box">
        Running Total: $<span id="total-display">0.00</span>
      </div>

      <button type="submit">Submit Till Count</button>
      <div class="status" id="status"></div>
      <div class="note">Enter the quantity of each coin or bill, not the dollar amount.</div>
    </form>
  </div>

  <script>
    const values = {
      pennies: 0.01,
      nickels: 0.05,
      dimes: 0.10,
      quarters: 0.25,
      ones: 1,
      twos: 2,
      fives: 5,
      tens: 10,
      twenties: 20,
      fifties: 50,
      hundreds: 100
    };

    const labels = {
      pennies: "Pennies",
      nickels: "Nickels",
      dimes: "Dimes",
      quarters: "Quarters",
      ones: "$1",
      twos: "$2",
      fives: "$5",
      tens: "$10",
      twenties: "$20",
      fifties: "$50",
      hundreds: "$100"
    };

    const coinIds = ["pennies", "nickels", "dimes", "quarters"];
    const billIds = ["ones", "twos", "fives", "tens", "twenties", "fifties", "hundreds"];

    const form = document.getElementById('till-form');
    const totalDisplay = document.getElementById('total-display');
    const totalHidden = document.getElementById('total-hidden');
    const statusBox = document.getElementById('status');
    const timestampHidden = document.getElementById('timestamp-hidden');
    const timestampIsoHidden = document.getElementById('timestamp-iso-hidden');

    function getCount(id) {
      const raw = document.getElementById(id).value;
      return raw === "" ? 0 : parseInt(raw, 10) || 0;
    }

    function calculateTotal() {
      let total = 0;

      for (const id in values) {
        const lineTotal = getCount(id) * values[id];
        total += lineTotal;

        document.getElementById(`${id}-total`).value = `$${lineTotal.toFixed(2)}`;
      }

      totalDisplay.textContent = total.toFixed(2);
      totalHidden.value = total.toFixed(2);
    }

    function setTimestamp() {
      const now = new Date();
      timestampHidden.value = now.toLocaleString();
      timestampIsoHidden.value = now.toISOString();
    }

    function formatMoney(value) {
      return `$${Number(value).toFixed(2)}`;
    }

    function getLineTotal(id) {
      return getCount(id) * values[id];
    }

    function buildColumnRows(leftIds, rightIds) {
      const maxRows = Math.max(leftIds.length, rightIds.length);
      let rows = "";

      for (let i = 0; i < maxRows; i++) {
        const leftId = leftIds[i];
        const rightId = rightIds[i];

        const leftCells = leftId
          ? `${labels[leftId]}: ${getCount(leftId)} = ${formatMoney(getLineTotal(leftId))}`
          : "";

        const rightCells = rightId
          ? `${labels[rightId]}: ${getCount(rightId)} = ${formatMoney(getLineTotal(rightId))}`
          : "";

        rows += `${leftCells.padEnd(28, " ")} | ${rightCells}\n`;
      }

      return rows;
    }

    function buildEmailMessage() {
      const associate = document.getElementById('associate').value.trim();
      const station = document.getElementById('station').value;

      return `Till Count Submission

` +
        `Associate: ${associate}
` +
        `Station: ${station}
` +
        `Submitted: ${timestampHidden.value}

` +
        `Coins                        | Bills
` +
        `-----------------------------|-----------------------------
` +
        buildColumnRows(coinIds, billIds) +
        `
Running Total: ${formatMoney(totalHidden.value)}
`;
    }

    Object.keys(values).forEach(id => {
      document.getElementById(id).addEventListener('input', calculateTotal);
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      calculateTotal();
      setTimestamp();

      statusBox.textContent = "Submitting...";

      const formData = new FormData();
      formData.append('access_key', form.querySelector('[name="access_key"]').value);
      formData.append('to', form.querySelector('[name="to"]').value);
      formData.append('from_name', 'Partake Till Counter');
      formData.append('subject', `Till Count - ${document.getElementById('station').value} - ${timestampHidden.value}`);
      formData.append('message', buildEmailMessage());

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          statusBox.textContent = "Submitted successfully.";
          form.reset();
          calculateTotal();
        } else {
          statusBox.textContent = "Submission failed. Please try again.";
        }
      } catch (error) {
        statusBox.textContent = "Submission failed. Please check connection and try again.";
      }
    });

    calculateTotal();
  </script>
</body>
</html>
